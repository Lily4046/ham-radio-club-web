<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>业余无线电社团协作管理系统</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=14">
</head>
<body>

  <!-- 应用外壳（登录后显示） -->
  <div id="appShell" class="hidden">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="logo.png" alt="社团 logo">
        <span class="title">业余无线电社团协作管理系统</span>
      </div>
      <div class="topbar-actions">
        <span id="userBadge" class="user-badge"></span>
        <button id="btnSettings" class="btn btn-ghost">⚙ 设置</button>
      </div>
    </header>

    <nav class="tabs" id="tabs"><!-- 由 JS 注入 --></nav>

    <main class="main">
      <div id="viewContainer"></div>
    </main>
  </div>

  <!-- 登录遮罩 -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img class="login-logo" src="logo.png" alt="社团 logo">
      <h1>登录系统</h1>
      <p class="muted">数据存储在私有 GitHub 仓库中，需先完成认证。</p>

      <!-- 1. GitHub 账号登录 -->
      <button id="btnLoginOAuth" class="btn btn-primary btn-block">使用 GitHub 账号登录</button>

      <div class="divider" id="loginDivider"><span>或</span></div>

      <!-- 2. 令牌登录（点击展开输入框） -->
      <button id="btnTokenToggle" class="btn btn-block" type="button">使用令牌登录</button>
      <div id="tokenForm" class="hidden">
        <div class="form-field">
          <label>GitHub 个人访问令牌（PAT）</label>
          <input type="password" id="loginToken" placeholder="ghp_..." autocomplete="off">
          <small>需具备 <code>repo</code> 权限；仅保存在本机浏览器，不会上传到第三方。</small>
        </div>
        <button id="btnLoginToken" class="btn btn-primary btn-block">登录</button>
      </div>

      <!-- 3. 游客登录 -->
      <button id="btnLoginGuest" class="btn btn-block btn-guest hidden">👀 游客登录（只读浏览）</button>

      <!-- 4. 公开 QSL 登记（无需登录，只能提交，看不到任何已有数据） -->
      <button id="btnPublicSubmit" class="btn btn-block hidden" type="button">📝 QSL 卡登记（无需登录）</button>

      <p id="loginError" class="error hidden"></p>
      <div id="oauthLoading" class="oauth-loading hidden">
        <span class="spinner"></span> 正在通过 GitHub 登录，请稍候…
      </div>
    </div>
  </div>

  <!-- 公开 QSL 登记页（无需登录；只渲染表单，不加载任何已有数据） -->
  <div id="submitScreen" class="login-screen hidden">
    <div class="login-card">
      <img class="login-logo" src="logo.png" alt="社团 logo">
      <h1>📝 QSL 卡登记</h1>
      <div id="submitFormWrap"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <!-- 脚本按顺序加载（依赖关系：config → auth → github → models → store → ui → views → submit → app） -->
  <script src="config.js?v=16"></script>
  <script src="js/auth.js?v=13"></script>
  <script src="js/github.js?v=15"></script>
  <script src="js/models.js?v=15"></script>
  <script src="js/store.js?v=15"></script>
  <script src="js/ui.js?v=14"></script>
  <script src="js/views.js?v=15"></script>
  <script src="js/submit.js?v=15"></script>
  <script src="js/app.js?v=16"></script>
</body>
</html>
